qlib_init:
    provider_uri: "~/.qlib/qlib_data/alpha_ledger_full"
    region: cn
market: &market all
benchmark: &benchmark SH000300
data_handler_config: &data_handler_config
    start_time: 2026-01-01
    end_time: 2026-06-03
    fit_start_time: 2026-01-01
    fit_end_time: 2026-04-30
    instruments: *market
task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.05
            subsample: 0.8789
            lambda_l1: 0.01
            lambda_l2: 0.1
            max_depth: 8
            num_leaves: 256
            early_stopping_rounds: 100
            num_boost_round: 2000
            num_threads: 20
            verbosity: -1
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2026-01-01, 2026-04-30]
                valid: [2026-05-01, 2026-05-15]
                test: [2026-05-16, 2026-06-03]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
